<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maya AI ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .box {
      width: 85%;
      max-width: 400px;
      padding: 25px;
      border-radius: 20px;
      background: rgba(255,255,255,0.18);
      box-shadow: 0 8px 25px #0002;
      text-align: center;
    }
    h1 { font-size: 32px; }
    #chat {
      height: 250px;
      overflow-y: auto;
      background: #fff;
      color: #333;
      padding: 12px;
      border-radius: 12px;
      text-align: left;
      margin: 15px 0;
    }
    input {
      width: 65%;
      padding: 12px;
      border: none;
      border-radius: 20px;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 20px;
      background: #ff3864;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>💖 Maya AI</h1>
    <p>Your sweet AI companion ❤️</p>
    <div id="chat">
      <p><b>Maya:</b> Hi! माया यहाँ छे ❤️ मलाई के भन्न चाहन्छौ?</p>
    </div>
    <input id="message" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>
  </div>  <script>
    function sendMessage() {
      const input = document.getElementById("message");
      const chat = document.getElementById("chat");
      const msg = input.value.trim();

      if (!msg) return;

      chat.innerHTML += "<p><b>You:</b> " + escapeHTML(msg) + "</p>";

      const reply = "माया यहाँ छे ❤️ तिम्रो कुरा सुनाउँदै जाऊ!";
      chat.innerHTML += "<p><b>Maya:</b> " + reply + "</p>";

      input.value = "";
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script></body>
</html>
