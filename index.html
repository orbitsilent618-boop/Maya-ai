<!DOCTYPE html><html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya AI 💖</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;min-height:100vh;
  background:linear-gradient(135deg,#7c3aed,#ec4899,#06b6d4);
  display:flex;align-items:center;justify-content:center;padding:15px
}
.app{
  width:100%;max-width:430px;height:90vh;max-height:760px;
  background:#ffffffed;border-radius:28px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 15px 45px #25104455
}
header{
  text-align:center;padding:18px;color:white;
  background:linear-gradient(120deg,#7c3aed,#ec4899)
}
header h1{margin:0;font-size:28px}
header p{margin:7px 0 0;font-size:14px}
#chat{flex:1;overflow-y:auto;padding:16px;background:#faf7ff}
.msg{padding:11px 14px;margin:10px 0;border-radius:17px;
  max-width:88%;line-height:1.5;overflow-wrap:anywhere}
.maya{background:#eee7ff;color:#37205d;border-bottom-left-radius:4px}
.user{background:#e0f7ff;color:#124b62;margin-left:auto;border-bottom-right-radius:4px}
.label{font-size:12px;font-weight:bold;margin-bottom:4px}
footer{padding:12px;display:flex;gap:7px;background:white;border-top:1px solid #eee}
input{min-width:0;flex:1;border:1px solid #ddd;border-radius:22px;padding:12px;font-size:15px;outline-color:#a855f7}
button{border:0;border-radius:22px;padding:11px 13px;background:#9333ea;color:white;font-size:15px}
button:active{opacity:.75}
.tools{display:flex;justify-content:center;gap:8px;padding:0 10px 12px;background:white}
.tools button{background:#ec4899;font-size:13px}
</style>
</head>
<body>
<div class="app">
<header>
<h1>🌈 Maya AI 💖</h1>
<p>तिम्रो साथी, तिम्रो माया ✨</p>
</header>
<div id="chat" aria-live="polite">
<div class="msg maya"><div class="label">💖 Maya</div>नमस्ते! म माया हुँ 😊❤️ तिमीलाई कस्तो छ? मसँग नेपाली वा English मा कुरा गर न!</div>
</div>
<div class="tools">
<button onclick="speakLast()">🔊 जवाफ सुन</button>
<button onclick="clearChat()">🧹 नयाँ च्याट</button>
</div>
<footer>
<input id="input" placeholder="मायालाई केही लेख..." autocomplete="off">
<button onclick="send()">पठाऊ ➤</button>
</footer>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('input');
let lastReply='नमस्ते! माया यहाँ छे ❤️';function addMessage(text,who){
const box=document.createElement('div');
box.className='msg '+who;
const label=document.createElement('div');
label.className='label';
label.textContent=who==='user'?'तिमी':'💖 Maya';
const content=document.createElement('div');
content.textContent=text;
box.append(label,content);
chat.appendChild(box);
chat.scrollTop=chat.scrollHeight;
}
function replyTo(text){
const t=text.toLowerCase();
if(/नमस्ते|हेलो|hello|hi\b|hey/.test(t))
return 'नमस्ते साथी! 🥰❤️ आज कस्तो छ? माया तिम्रो कुरा सुन्न तयार छे!';
if(/नाम|name/.test(t))
return 'मेरो नाम Maya AI हो! 🌈💖 तिमी मलाई माया भनेर बोलाउन सक्छौ।';
if(/कस्तो छ|कस्ती छ|how are you/.test(t))
return 'म राम्रो छु! 😊 तिमीलाई कस्तो छ? आजको दिन कस्तो भयो?';
if(/माया|love|मायालु|माया गर्छ/.test(t))
return 'तिमीसँग मिठो कुरा गर्न पाउँदा खुसी लाग्छ ❤️😊 माया र सम्मानका साथ कुरा गरौँ!';
if(/धन्यवाद|thanks|thank you/.test(t))
return 'स्वागत छ! 💖 म तिमीलाई सहयोग गर्न यहाँ छु।';
if(/समय|time/.test(t))
return 'आफ्नो मोबाइलको घडीमा अहिलेको समय हेर्न सक्छौ ⏰';
if(/बाइ|bye|good night/.test(t))
return 'ल है, फेरि भेटौँला! 💖 आफ्नो ख्याल राख्नु!';
if(/help|सहयोग/.test(t))
return 'मसँग नमस्ते, नाम, माया वा कस्तो छ भनेर सोधेर हेर 😊 यो अहिले demo संस्करण हो।';
return 'तिम्रो कुरा सुनेँ ❤️😊 म Maya AI को demo हुँ, त्यसैले सबै प्रश्नको वास्तविक AI-जस्तो उत्तर दिन अझै AI सेवा जोड्नुपर्छ। अहिले मसँग अरू कुरा पनि गर न!';
}
function send(){
const text=input.value.trim();
if(!text)return;
addMessage(text,'user');
input.value='';
lastReply=replyTo(text);
addMessage(lastReply,'maya');
}
function speakLast(){
if(!('speechSynthesis' in window)){
alert('तिम्रो browser मा आवाज सुविधा उपलब्ध छैन।');
return;
}
speechSynthesis.cancel();
const utter=new SpeechSynthesisUtterance(lastReply);
utter.lang='ne-NP';
utter.rate=0.92;
speechSynthesis.speak(utter);
}
function clearChat(){
chat.replaceChildren();
lastReply='नमस्ते! माया यहाँ छे ❤️';
addMessage('फेरि स्वागत छ! 🥰 के कुरा गर्ने आज?','maya');
}
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>

</body>
</html>
